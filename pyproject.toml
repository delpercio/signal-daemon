[project]
name = "signal-daemon"
version = "0.1.0"
description = "Mac capture daemon that streams AI development activity into Anton"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "sqlite-utils>=3.36",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.1.0",
]

[project.scripts]
signal-daemon = "signal_daemon.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_daemon*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
