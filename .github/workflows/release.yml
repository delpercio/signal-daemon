name: Build macOS Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Standalone Binary
        run: |
          pyinstaller --name signal-daemon --onefile --clean signal_daemon/cli.py
          
          # The binary will be output to dist/signal-daemon
          chmod +x dist/signal-daemon

      - name: Upload Artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: signal-daemon-mac
          path: dist/signal-daemon
          retention-days: 5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/signal-daemon
          generate_release_notes: true
